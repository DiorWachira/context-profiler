name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src/ctxprof
      - run: pytest -q

  web:
    name: Web (typecheck, build, e2e on the static snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e .
      - name: Demo data (200 profiled + 60 held-out traces, prune, verify)
        run: ctxprof demo
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - name: Static build + API snapshot
        run: |
          VITE_STATIC=1 npm run build --prefix web
          ctxprof export --out web/dist
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7
      - name: Upload site for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  docker:
    name: Docker image (build, run, smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ctxprof .
      - name: Smoke test
        run: |
          docker run -d --name ctxprof -p 8000:8000 ctxprof
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/api/prunes | python3 -c "import json,sys; p=json.load(sys.stdin); assert len(p)==2 and any(x['recommend'] for x in p), p"
          curl -fs localhost:8000/ | grep -q '<div id="root">'
      - if: always()
        run: docker logs ctxprof || true

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, web, docker]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
