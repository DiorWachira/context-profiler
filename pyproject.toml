[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxprof"
version = "0.1.0"
description = "Context Profiler: ablation-based attribution and cost profiling for LLM context windows"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Dior Wachira" }]
dependencies = [
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "numpy>=1.26",
  "scikit-learn>=1.7",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ctxprof = "ctxprof.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctxprof = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
