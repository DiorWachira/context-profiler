[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxprof"
version = "0.2.0"
description = "Context Profiler: ablation-based attribution and cost profiling for LLM context windows"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Dior Wachira" }]
dependencies = [
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "numpy>=1.26",
  "scikit-learn>=1.7",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7"]
local = ["torch>=2.4", "transformers>=4.50"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
ctxprof = "ctxprof.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctxprof = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: needs a real local model (pip install -e .[local]); run with -m slow"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "sklearn.*", "scipy.*"]
follow_imports = "skip"
